name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download current site
        run: |
          curl -fsSL https://seemly-slide-qse9f.shipped.run/site.zip -o site.zip
          mkdir public
          unzip -q site.zip -d public
          find public -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.webmanifest' \) -print0 | xargs -0 sed -i \
            -e 's#"/_next/#"/hubei-exam-study-workbench/_next/#g' \
            -e "s#'/_next/#'/hubei-exam-study-workbench/_next/#g" \
            -e 's#`/_next/#`/hubei-exam-study-workbench/_next/#g' \
            -e 's#"/api/#"/hubei-exam-study-workbench/api/#g' \
            -e "s#'/api/#'/hubei-exam-study-workbench/api/#g" \
            -e 's#`/api/#`/hubei-exam-study-workbench/api/#g' \
            -e 's#"/manifest.webmanifest"#"/hubei-exam-study-workbench/manifest.webmanifest"#g' \
            -e 's#"/favicon.svg"#"/hubei-exam-study-workbench/favicon.svg"#g'
          python - <<'PY'
          import json
          path = 'public/manifest.webmanifest'
          with open(path, 'r', encoding='utf-8') as file:
              manifest = json.load(file)
          manifest['id'] = '/hubei-exam-study-workbench/'
          manifest['start_url'] = '/hubei-exam-study-workbench/'
          manifest['scope'] = '/hubei-exam-study-workbench/'
          with open(path, 'w', encoding='utf-8') as file:
              json.dump(manifest, file, ensure_ascii=False, indent=2)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
